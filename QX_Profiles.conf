url-latency-benchmark=美国节点, server-tag-regex=(?=.*(美|US|(?i)States|American))^((?!(港|台|日|新|英|韩|韓|HK|TW|JP|SG|UK|KR)).)*$, check-interval=600, tolerance=0, img-url=https://github.com/ByteTimes/FilterRules/raw/Rules/Images/Color/country/US.png
