url-latency-benchmark=自动选择, server-tag-regex=^(?!.*(?:墨瑾|dreamstart.site)).*$, check-interval=600, tolerance=0, img-url=https://github.com/ByteTimes/FilterRules/raw/Rules/Images/Color/Auto.png
